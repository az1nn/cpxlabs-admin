name: Bootstrap Spec Kit

on:
  push:
    branches:
      - chore/speckit-adoption

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ !contains(github.event.head_commit.message, '[speckit-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/speckit-adoption

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned Spec Kit
        run: python -m pip install 'git+https://github.com/github/spec-kit.git@v1.0.4'

      - name: Initialize Spec Kit for Codex
        run: specify init --here --force --non-interactive --integration codex --ignore-agent-tools

      - name: Install OpenCode integration
        run: specify integration install opencode --force

      - name: Commit generated Spec Kit infrastructure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .specify .agents .opencode .codex opencode.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'chore: initialize Spec Kit v1.0.4 [speckit-generated]'
          git push origin HEAD:chore/speckit-adoption
