name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cpxlabs_admin
      BETTER_AUTH_SECRET: cpxlabs-ci-better-auth-secret-0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3001
      APP_ORIGIN: http://127.0.0.1:4173
      SEED_AUTH_PASSWORD: TestAuthPass123!
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpxlabs_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @cpxlabs-admin/api db:migrate

      - name: Seed reference data
        run: pnpm --filter @cpxlabs-admin/api db:seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  browser-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/cpxlabs_admin
      BETTER_AUTH_SECRET: cpxlabs-ci-better-auth-secret-0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3001
      APP_ORIGIN: http://127.0.0.1:4173
      SEED_AUTH_PASSWORD: TestAuthPass123!
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpxlabs_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm --filter @cpxlabs-admin/api db:migrate

      - name: Seed reference data
        run: pnpm --filter @cpxlabs-admin/api db:seed

      - name: Install Chromium
        run: pnpm --filter @cpxlabs-admin/web exec playwright install chromium --with-deps

      - name: Storybook component and accessibility tests
        run: pnpm test:storybook

      - name: Playwright E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
