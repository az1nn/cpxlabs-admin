name: Update Auth Web Lockfile

on:
  push:
    branches:
      - feat/005-authentication-authorization

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[auth-web-lock-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/005-authentication-authorization
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: update auth web lockfile [auth-web-lock-generated]'
          git push origin HEAD:feat/005-authentication-authorization
