name: Normalize Spec Kit Integration

on:
  push:
    branches:
      - chore/speckit-adoption

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[speckit-uninstall-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: chore/speckit-adoption

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pinned Spec Kit
        run: python -m pip install 'git+https://github.com/github/spec-kit.git@v1.0.4'

      - name: Remove unsafe simultaneous OpenCode integration
        run: specify integration uninstall opencode

      - name: Commit normalized integration state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .specify .opencode
          if git diff --cached --quiet; then
            echo 'No integration changes to commit.'
            exit 0
          fi
          git commit -m 'chore: keep Codex as single Spec Kit integration [speckit-uninstall-generated]'
          git push origin HEAD:chore/speckit-adoption
