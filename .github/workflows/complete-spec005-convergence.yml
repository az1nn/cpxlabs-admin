name: Complete Spec 005 Convergence

on:
  push:
    branches:
      - feat/005-auth-hardening-converge

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[spec005-converged]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/005-auth-hardening-converge
      - name: Mark convergence task complete
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('specs/005-authentication-authorization/tasks.md')
          text = path.read_text()
          old = '- [ ] T043 Validate all SC-001 through SC-008 and record any remaining convergence gaps in `specs/005-authentication-authorization/tasks.md`'
          new = '- [x] T043 Validate all SC-001 through SC-008 and record any remaining convergence gaps in `specs/005-authentication-authorization/tasks.md`'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one unchecked T043')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit convergence state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/005-authentication-authorization/tasks.md
          git commit -m 'docs(spec): close clean 005 convergence [spec005-converged]'
          git push origin HEAD:feat/005-auth-hardening-converge
