name: Complete Spec 005 Tasks

on:
  push:
    branches:
      - feat/005-auth-hardening-converge

permissions:
  contents: write

jobs:
  complete:
    if: ${{ !contains(github.event.head_commit.message, '[spec005-tasks-completed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/005-auth-hardening-converge
      - name: Mark implemented tasks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('specs/005-authentication-authorization/tasks.md')
          text = path.read_text()
          for number in range(1, 43):
              task = f'T{number:03d}'
              text, count = re.subn(rf'- \[ \] ({task}\b)', r'- [x] \1', text, count=1)
              if count != 1:
                  raise SystemExit(f'Expected one unchecked {task}, found {count}')
          path.write_text(text)
          PY
      - name: Commit task state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/005-authentication-authorization/tasks.md
          git commit -m 'docs(spec): mark implemented 005 tasks [spec005-tasks-completed]'
          git push origin HEAD:feat/005-auth-hardening-converge
