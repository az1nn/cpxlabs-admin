name: Engineering Graph

on:
  push:
    paths:
      - 'engineering-graph/**'
      - 'specs/**'
      - 'docs/adr/**'
      - 'docs/architecture/ENGINEERING_GRAPH.md'
      - 'docs/architecture/AGENT_CONTEXT_GRAPH.md'
      - 'docs/development/engineering-graph.md'
      - 'AGENTS.md'
      - '.specify/templates/**'
      - '.github/workflows/engineering-graph.yml'
  pull_request:
    paths:
      - 'engineering-graph/**'
      - 'specs/**'
      - 'docs/adr/**'
      - 'docs/architecture/ENGINEERING_GRAPH.md'
      - 'docs/architecture/AGENT_CONTEXT_GRAPH.md'
      - 'docs/development/engineering-graph.md'
      - 'AGENTS.md'
      - '.specify/templates/**'
      - '.github/workflows/engineering-graph.yml'

permissions:
  contents: read

jobs:
  graph-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:2026.07.1
        env:
          NEO4J_AUTH: neo4j/graph-ci-password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graph-ci-password
      NEO4J_DATABASE: neo4j
      GRAPH_REPOSITORY_ID: az1nn/cpxlabs-admin

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Engineering Graph
        run: python -m pip install -e engineering-graph

      - name: Run offline unit tests
        run: python -m unittest discover -s engineering-graph/tests -v

      - name: Verify application packages do not depend on graph runtime
        shell: bash
        run: |
          if grep -R -n -E '(from[[:space:]]+engineering_graph|import[[:space:]]+engineering_graph|neo4j)' apps packages \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --include='package.json'; then
            echo 'Application code must not depend on Engineering Graph / Neo4j.' >&2
            exit 1
          fi

      - name: Wait for Neo4j and validate definitions
        run: graph-engineering doctor --wait 90

      - name: Initialize graph schema
        run: graph-engineering schema

      - name: Full repository sync
        run: graph-engineering sync --github-event "$GITHUB_EVENT_PATH" --json | tee /tmp/graph-sync-1.json

      - name: Capture logical graph stats
        run: graph-engineering stats --json | tee /tmp/graph-stats-1.json

      - name: Repeat full sync for idempotency smoke
        run: |
          graph-engineering sync --github-event "$GITHUB_EVENT_PATH" --json | tee /tmp/graph-sync-2.json
          graph-engineering stats --json | tee /tmp/graph-stats-2.json
          cmp /tmp/graph-stats-1.json /tmp/graph-stats-2.json

      - name: Validate architecture graph
        run: graph-engineering validate

      - name: Smoke fundamental graph queries
        shell: bash
        run: |
          graph-engineering impact ADR-0018 --depth 3 --limit 100 --json
          graph-engineering ready --spec SPEC-010-AGENT-CONTEXT-GRAPH --json
          graph-engineering conflicts --spec SPEC-010-AGENT-CONTEXT-GRAPH --json
          graph-engineering drift --json
          graph-engineering context SPEC-010-AGENT-CONTEXT-GRAPH:T044 --format json
          graph-engineering waves --spec SPEC-010-AGENT-CONTEXT-GRAPH --json
          graph-engineering stats --json

      - name: Generate one portable Agent Context package
        run: |
          graph-engineering context-batch \
            --task SPEC-010-AGENT-CONTEXT-GRAPH:T044 \
            --output-root /tmp/agent-context-single \
            --json | tee /tmp/agent-context-single-manifest.json
          test -f /tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/context.json
          test -f /tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/context.md
          test -f /tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/codex.md
          test -f /tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/claude.md

      - name: Strictly validate package freshness
        run: |
          graph-engineering context-validate \
            /tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/context.json \
            --strict --json

      - name: Prove adapter rendering from portable package
        run: |
          PACKAGE=/tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/context.json
          graph-engineering context-adapt "$PACKAGE" --agent codex --output /tmp/codex-handoff.md
          graph-engineering context-adapt "$PACKAGE" --agent claude --output /tmp/claude-handoff.md
          grep -q 'AGENTS.md' /tmp/codex-handoff.md
          grep -q 'SPEC-010-AGENT-CONTEXT-GRAPH:T044' /tmp/codex-handoff.md
          grep -q 'SPEC-010-AGENT-CONTEXT-GRAPH:T044' /tmp/claude-handoff.md

      - name: Prove semantic package reproducibility
        shell: bash
        run: |
          PACKAGE=/tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/context.json
          cp "$PACKAGE" /tmp/context-before.json
          graph-engineering context-batch \
            --task SPEC-010-AGENT-CONTEXT-GRAPH:T044 \
            --output-root /tmp/agent-context-single \
            --json >/tmp/regenerated-manifest.json
          python - <<'PY'
          from pathlib import Path
          from engineering_graph.context_validation import load_context_package
          before = load_context_package(Path('/tmp/context-before.json'))
          after = load_context_package(Path('/tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/context.json'))
          if before.semantic_json() != after.semantic_json():
              raise SystemExit('Context package semantic content changed at the same revision')
          PY

      - name: Generate READY task context packages
        shell: bash
        run: |
          graph-engineering context-batch \
            --spec SPEC-010-AGENT-CONTEXT-GRAPH \
            --output-root /tmp/agent-context-ready \
            --json | tee /tmp/agent-context-ready-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/agent-context-ready-manifest.json').read_text())
          if payload.get('packageCount', 0) < 1:
              raise SystemExit('Expected at least one READY task context package')
          PY

      - name: Prove generated packages are disposable
        run: |
          rm -rf /tmp/agent-context-single
          graph-engineering context-batch \
            --task SPEC-010-AGENT-CONTEXT-GRAPH:T044 \
            --output-root /tmp/agent-context-single \
            --json >/tmp/disposable-regenerated.json
          graph-engineering context-validate \
            /tmp/agent-context-single/SPEC-010-AGENT-CONTEXT-GRAPH/SPEC-010-AGENT-CONTEXT-GRAPH_T044/context.json \
            --strict
