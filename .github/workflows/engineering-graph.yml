name: Engineering Graph

on:
  push:
    paths:
      - 'engineering-graph/**'
      - 'specs/**'
      - 'docs/adr/**'
      - 'docs/architecture/ENGINEERING_GRAPH.md'
      - 'docs/development/engineering-graph.md'
      - 'AGENTS.md'
      - '.specify/templates/**'
      - '.github/workflows/engineering-graph.yml'
  pull_request:
    paths:
      - 'engineering-graph/**'
      - 'specs/**'
      - 'docs/adr/**'
      - 'docs/architecture/ENGINEERING_GRAPH.md'
      - 'docs/development/engineering-graph.md'
      - 'AGENTS.md'
      - '.specify/templates/**'
      - '.github/workflows/engineering-graph.yml'

permissions:
  contents: read

jobs:
  graph-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:2026.07.1
        env:
          NEO4J_AUTH: neo4j/graph-ci-password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graph-ci-password
      NEO4J_DATABASE: neo4j
      GRAPH_REPOSITORY_ID: az1nn/cpxlabs-admin

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Engineering Graph
        run: python -m pip install -e engineering-graph

      - name: Run offline unit tests
        run: python -m unittest discover -s engineering-graph/tests -v

      - name: Verify application packages do not depend on graph runtime
        shell: bash
        run: |
          if grep -R -n -E '(from[[:space:]]+engineering_graph|import[[:space:]]+engineering_graph|neo4j)' apps packages \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --include='package.json'; then
            echo 'Application code must not depend on Engineering Graph / Neo4j.' >&2
            exit 1
          fi

      - name: Wait for Neo4j and validate definitions
        run: graph-engineering doctor --wait 90

      - name: Initialize graph schema
        run: graph-engineering schema

      - name: Full repository sync
        run: graph-engineering sync --github-event "$GITHUB_EVENT_PATH" --json | tee /tmp/graph-sync-1.json

      - name: Capture logical graph stats
        run: graph-engineering stats --json | tee /tmp/graph-stats-1.json

      - name: Repeat full sync for idempotency smoke
        run: |
          graph-engineering sync --github-event "$GITHUB_EVENT_PATH" --json | tee /tmp/graph-sync-2.json
          graph-engineering stats --json | tee /tmp/graph-stats-2.json
          cmp /tmp/graph-stats-1.json /tmp/graph-stats-2.json

      - name: Validate architecture graph
        run: graph-engineering validate

      - name: Smoke fundamental graph queries
        shell: bash
        run: |
          graph-engineering impact ADR-0017 --depth 3 --limit 100 --json
          graph-engineering ready --spec SPEC-009-GRAPH-ENGINEERING-CONTROL-PLANE --json
          graph-engineering conflicts --spec SPEC-009-GRAPH-ENGINEERING-CONTROL-PLANE --json
          graph-engineering context SPEC-009-GRAPH-ENGINEERING-CONTROL-PLANE:T061 --format json
          graph-engineering waves --spec SPEC-009-GRAPH-ENGINEERING-CONTROL-PLANE --json
          graph-engineering stats --json
