name: Engineering Graph

on:
  push:
    paths:
      - 'engineering-graph/**'
      - 'specs/**'
      - 'docs/adr/**'
      - 'docs/architecture/ENGINEERING_GRAPH.md'
      - 'docs/architecture/AGENT_CONTEXT_GRAPH.md'
      - 'docs/architecture/EXECUTION_GRAPH.md'
      - 'docs/development/engineering-graph.md'
      - 'AGENTS.md'
      - '.specify/templates/**'
      - '.github/workflows/engineering-graph.yml'
  pull_request:
    paths:
      - 'engineering-graph/**'
      - 'specs/**'
      - 'docs/adr/**'
      - 'docs/architecture/ENGINEERING_GRAPH.md'
      - 'docs/architecture/AGENT_CONTEXT_GRAPH.md'
      - 'docs/architecture/EXECUTION_GRAPH.md'
      - 'docs/development/engineering-graph.md'
      - 'AGENTS.md'
      - '.specify/templates/**'
      - '.github/workflows/engineering-graph.yml'

permissions:
  contents: read

jobs:
  graph-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:2026.07.1
        env:
          NEO4J_AUTH: neo4j/graph-ci-password
        ports:
          - 7474:7474
          - 7687:7687

    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graph-ci-password
      NEO4J_DATABASE: neo4j
      GRAPH_REPOSITORY_ID: az1nn/cpxlabs-admin
      CONTEXT_SPEC_ID: SPEC-010-AGENT-CONTEXT-GRAPH
      EXECUTION_SPEC_ID: SPEC-011-EXECUTION-GRAPH

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Engineering Graph
        run: python -m pip install -e engineering-graph

      - name: Run offline unit and Git worktree integration tests
        run: python -m unittest discover -s engineering-graph/tests -v

      - name: Verify application packages do not depend on graph runtime
        shell: bash
        run: |
          if grep -R -n -E '(from[[:space:]]+engineering_graph|import[[:space:]]+engineering_graph|neo4j)' apps packages \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' --include='package.json'; then
            echo 'Application code must not depend on Engineering Graph / Neo4j.' >&2
            exit 1
          fi

      - name: Wait for Neo4j and validate definitions
        run: graph-engineering doctor --wait 90

      - name: Initialize graph schema
        run: graph-engineering schema

      - name: Full repository sync
        run: graph-engineering sync --github-event "$GITHUB_EVENT_PATH" --json | tee /tmp/graph-sync-1.json

      - name: Capture logical graph stats
        run: graph-engineering stats --json | tee /tmp/graph-stats-1.json

      - name: Repeat full sync for idempotency smoke
        run: |
          graph-engineering sync --github-event "$GITHUB_EVENT_PATH" --json | tee /tmp/graph-sync-2.json
          graph-engineering stats --json | tee /tmp/graph-stats-2.json
          cmp /tmp/graph-stats-1.json /tmp/graph-stats-2.json

      - name: Validate architecture graph
        run: graph-engineering validate

      - name: Select deterministic projected task for V2 smokes
        shell: bash
        run: |
          python - <<'PY'
          import os
          from engineering_graph.config import load_settings
          from engineering_graph.store import GraphStore

          settings = load_settings()
          spec_id = os.environ['CONTEXT_SPEC_ID']
          with GraphStore(settings) as store:
              rows = store.run(
                  '''
                  MATCH (spec:Spec {repository: $repository, canonicalId: $specId})
                        -[:DECOMPOSED_INTO]->
                        (task:Task {repository: $repository})
                  RETURN task.canonicalId AS taskId
                  ORDER BY task.canonicalId
                  LIMIT 1
                  ''',
                  {'repository': settings.repository_id, 'specId': spec_id},
              )
          if not rows or not rows[0].get('taskId'):
              raise SystemExit(f'No projected task found for {spec_id}')

          task_id = str(rows[0]['taskId'])
          task_dir = task_id.replace(':', '_')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'CONTEXT_TASK_ID={task_id}\n')
              env_file.write(f'CONTEXT_TASK_DIR={task_dir}\n')
          print(f'Selected projected task: {task_id}')
          PY

      - name: Smoke fundamental graph queries
        shell: bash
        run: |
          graph-engineering impact ADR-0019 --depth 3 --limit 100 --json
          graph-engineering ready --spec "$CONTEXT_SPEC_ID" --json
          graph-engineering conflicts --spec "$CONTEXT_SPEC_ID" --json
          graph-engineering drift --json
          graph-engineering context "$CONTEXT_TASK_ID" --format json
          graph-engineering waves --spec "$CONTEXT_SPEC_ID" --json
          graph-engineering stats --json

      - name: Generate one portable Agent Context package
        run: |
          graph-engineering context-batch \
            --task "$CONTEXT_TASK_ID" \
            --output-root /tmp/agent-context-single \
            --json | tee /tmp/agent-context-single-manifest.json
          test -f "/tmp/agent-context-single/$CONTEXT_SPEC_ID/$CONTEXT_TASK_DIR/context.json"
          test -f "/tmp/agent-context-single/$CONTEXT_SPEC_ID/$CONTEXT_TASK_DIR/context.md"
          test -f "/tmp/agent-context-single/$CONTEXT_SPEC_ID/$CONTEXT_TASK_DIR/codex.md"
          test -f "/tmp/agent-context-single/$CONTEXT_SPEC_ID/$CONTEXT_TASK_DIR/claude.md"

      - name: Strictly validate package freshness
        run: |
          graph-engineering context-validate \
            "/tmp/agent-context-single/$CONTEXT_SPEC_ID/$CONTEXT_TASK_DIR/context.json" \
            --strict --json

      - name: Prove adapter rendering from portable package
        run: |
          PACKAGE="/tmp/agent-context-single/$CONTEXT_SPEC_ID/$CONTEXT_TASK_DIR/context.json"
          graph-engineering context-adapt "$PACKAGE" --agent codex --output /tmp/codex-handoff.md
          graph-engineering context-adapt "$PACKAGE" --agent claude --output /tmp/claude-handoff.md
          grep -q 'AGENTS.md' /tmp/codex-handoff.md
          grep -q "$CONTEXT_TASK_ID" /tmp/codex-handoff.md
          grep -q "$CONTEXT_TASK_ID" /tmp/claude-handoff.md

      - name: Prove semantic package reproducibility
        shell: bash
        run: |
          PACKAGE="/tmp/agent-context-single/$CONTEXT_SPEC_ID/$CONTEXT_TASK_DIR/context.json"
          cp "$PACKAGE" /tmp/context-before.json
          graph-engineering context-batch \
            --task "$CONTEXT_TASK_ID" \
            --output-root /tmp/agent-context-single \
            --json >/tmp/regenerated-manifest.json
          python - <<'PY'
          import os
          from pathlib import Path
          from engineering_graph.context_validation import load_context_package

          before = load_context_package(Path('/tmp/context-before.json'))
          after_path = (
              Path('/tmp/agent-context-single')
              / os.environ['CONTEXT_SPEC_ID']
              / os.environ['CONTEXT_TASK_DIR']
              / 'context.json'
          )
          after = load_context_package(after_path)
          if before.semantic_json() != after.semantic_json():
              raise SystemExit('Context package semantic content changed at the same revision')
          PY

      - name: Generate READY task context packages
        shell: bash
        run: |
          graph-engineering context-batch \
            --spec "$CONTEXT_SPEC_ID" \
            --output-root /tmp/agent-context-ready \
            --json | tee /tmp/agent-context-ready-manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/agent-context-ready-manifest.json').read_text())
          tasks = payload.get('tasks')
          package_count = payload.get('packageCount')
          if not isinstance(tasks, list) or package_count != len(tasks):
              raise SystemExit('READY context manifest count does not match tasks')
          print(f'READY package count: {package_count}')
          PY

      - name: Prove generated packages are disposable
        run: |
          rm -rf /tmp/agent-context-single
          graph-engineering context-batch \
            --task "$CONTEXT_TASK_ID" \
            --output-root /tmp/agent-context-single \
            --json >/tmp/disposable-regenerated.json
          graph-engineering context-validate \
            "/tmp/agent-context-single/$CONTEXT_SPEC_ID/$CONTEXT_TASK_DIR/context.json" \
            --strict

      - name: Generate V3 Execution Graph manifest
        run: |
          graph-engineering execution-plan \
            --spec "$EXECUTION_SPEC_ID" \
            --agent codex \
            --output /tmp/execution-manifest-1.json \
            --json | tee /tmp/execution-plan-output.json
          test -f /tmp/execution-manifest-1.json

      - name: Prove execution manifest semantic reproducibility
        run: |
          graph-engineering execution-plan \
            --spec "$EXECUTION_SPEC_ID" \
            --agent codex \
            --output /tmp/execution-manifest-2.json \
            --json >/tmp/execution-plan-output-2.json
          python - <<'PY'
          from pathlib import Path
          from engineering_graph.execution import load_execution_manifest

          first = load_execution_manifest(Path('/tmp/execution-manifest-1.json'))
          second = load_execution_manifest(Path('/tmp/execution-manifest-2.json'))
          if first.semantic_json() != second.semantic_json():
              raise SystemExit('Execution manifest semantic content changed at the same revision')
          PY

      - name: Prove execution waves are conflict safe
        run: |
          python - <<'PY'
          from pathlib import Path
          from engineering_graph.execution import load_execution_manifest

          manifest = load_execution_manifest(Path('/tmp/execution-manifest-1.json'))
          wave_by_task = {
              task: wave.index
              for wave in manifest.waves
              for task in wave.tasks
          }
          for conflict in manifest.conflicts:
              left = wave_by_task.get(conflict.left)
              right = wave_by_task.get(conflict.right)
              if left is not None and left == right:
                  raise SystemExit(
                      f'Conflicting tasks share wave {left}: {conflict.left} <> {conflict.right}'
                  )
          print(f'Execution waves: {len(manifest.waves)}; conflicts: {len(manifest.conflicts)}')
          PY

      - name: Validate V3 allocation or completed-spec state without mutating Git worktrees
        shell: bash
        run: |
          EXECUTION_TASK_ID="$(python - <<'PY'
          from pathlib import Path
          from engineering_graph.execution import load_execution_manifest

          manifest = load_execution_manifest(Path('/tmp/execution-manifest-1.json'))
          if manifest.cycles:
              raise SystemExit('Cannot validate execution allocation with dependency cycles')

          if manifest.waves and manifest.waves[0].tasks:
              print(manifest.waves[0].tasks[0])
          else:
              if manifest.ready or manifest.blocked:
                  raise SystemExit(
                      'Execution manifest has no runnable waves but still contains unfinished READY/BLOCKED tasks'
                  )
              print('')
          PY
          )"

          if [[ -n "$EXECUTION_TASK_ID" ]]; then
            graph-engineering execution-prepare \
              /tmp/execution-manifest-1.json \
              --task "$EXECUTION_TASK_ID" \
              --execution-root /tmp/execution-graph-dry-run \
              --dry-run \
              --json | tee /tmp/execution-dry-run.json
          else
            echo 'Execution spec has no runnable waves and no unfinished tasks; completed-state smoke passed.'
          fi

          test ! -f /tmp/execution-graph-dry-run/leases.json
