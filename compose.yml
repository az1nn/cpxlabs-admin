services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cpxlabs_admin
    ports:
      - '5432:5432'
    volumes:
      - cpxlabs_admin_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cpxlabs_admin']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cpxlabs_admin_postgres:
