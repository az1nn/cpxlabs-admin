services:
  neo4j:
    image: neo4j:2026.07.1
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-cpxlabs-graph-local}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-cpxlabs-graph-local}
    ports:
      - '7474:7474'
      - '7687:7687'
    volumes:
      - cpxlabs_admin_engineering_graph:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$${NEO4J_PASSWORD}" 'RETURN 1' >/dev/null 2>&1 || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  cpxlabs_admin_engineering_graph:
